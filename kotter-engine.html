<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Transformation OS — Implement Consulting Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ch:#2E3338;--dk:#1A1C1F;--mid:#6B6F78;
  --lt:#E8E8E8;--pale:#F4F4F4;--wh:#FFFFFF;--ink:#1A1A1A;
  --st:#3A6080;--stp:#EEF3F8;--stl:#BDD0E0;
  --ok:#3A6B4A;--risk:#8C3A3A;--warn:#7A5C20;
  --serif:'Cormorant Garamond',Georgia,serif;
  --mono:'DM Mono',monospace;
  --sans:'Inter',system-ui,sans-serif;
}
body{background:var(--wh);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;overflow-x:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--lt);border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes neuronPop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.3)}100%{transform:scale(1);opacity:1}}
@keyframes lineDraw{from{stroke-dashoffset:200}to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes waveMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes dnaRotate{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@keyframes strandPulse{0%,100%{opacity:.7}50%{opacity:1}}
.dna-wrap{position:relative;width:100%;height:180px;overflow:hidden;background:var(--pale);border-radius:2px;margin-bottom:10px}
.dna-svg{width:100%;height:100%}
.fu{animation:fadeUp .45s ease forwards}
.fi{animation:fadeIn .35s ease forwards}
.pulse{animation:pulse 2s infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef}=React;

/* ══════════════════════════════════
   GLOBAL STYLES
══════════════════════════════════ */
const CSS=`
.app{min-height:100vh;background:var(--wh);padding-bottom:44px}

/* ── LANDING ── */
.land{height:100vh;background:var(--ch);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;text-align:center;position:relative;overflow:hidden}
.land::before{content:'Transformation OS';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-size:220px;color:rgba(255,255,255,.025);white-space:nowrap;pointer-events:none;line-height:1;font-weight:300}
.land-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:4px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-bottom:16px}
.land-title{font-family:var(--serif);font-size:88px;font-weight:400;color:var(--wh);line-height:.95;letter-spacing:-1px;margin-bottom:20px}
.land-title span{display:block}
.land-tagline{font-family:var(--serif);font-size:20px;font-style:italic;color:rgba(255,255,255,.7);max-width:600px;line-height:1.6;margin-bottom:48px}
.land-tagline strong{color:var(--wh);font-style:normal}
.land-cta{font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:14px 32px;background:var(--wh);color:var(--ch);border:none;border-radius:2px;cursor:pointer;text-transform:uppercase;transition:all .2s}
.land-cta:hover{background:rgba(255,255,255,.85)}
.land-meta{position:absolute;bottom:28px;font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.25);letter-spacing:2px;text-transform:uppercase}

/* ── ROLE SELECTOR ── */
.role-sel{height:100vh;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.role-half{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:56px;cursor:pointer;overflow:hidden;transition:all .35s}
.role-half.rsp{background:var(--ch)}
.role-half.rjc{background:var(--wh);border-left:1px solid var(--lt)}
.role-half:hover{transform:scale(1.01)}
.role-bg{position:absolute;font-family:var(--serif);font-size:140px;line-height:1;font-weight:300;opacity:.04;pointer-events:none;bottom:-10px;right:-8px;white-space:nowrap;transition:opacity .3s}
.role-half:hover .role-bg{opacity:.08}
.role-label{font-family:var(--mono);font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:14px}
.role-title{font-family:var(--serif);font-size:56px;font-weight:400;line-height:1.05;margin-bottom:12px;text-align:center}
.role-sub{font-family:var(--serif);font-size:16px;font-style:italic;text-align:center;line-height:1.6;max-width:280px;margin-bottom:28px}
.role-modules{display:flex;flex-direction:column;gap:5px;margin-bottom:28px;width:100%;max-width:280px}
.role-module{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:2px}
.role-module-num{font-family:var(--mono);font-size:8px;letter-spacing:1px;width:20px;flex-shrink:0}
.role-module-name{font-size:12px;font-weight:500}
.role-cta{font-family:var(--mono);font-size:10px;letter-spacing:2px;padding:10px 24px;border-radius:2px;cursor:pointer;text-transform:uppercase;border:none;opacity:0;transform:translateY(6px);transition:all .25s}
.role-half:hover .role-cta{opacity:1;transform:translateY(0)}
.rsp .role-label{color:rgba(255,255,255,.4)}
.rsp .role-title{color:var(--wh)}
.rsp .role-sub{color:rgba(255,255,255,.55)}
.rsp .role-module{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.rsp .role-module-num{color:rgba(255,255,255,.3)}
.rsp .role-module-name{color:rgba(255,255,255,.8)}
.rsp .role-cta{background:var(--wh);color:var(--ch)}
.rsp .role-bg{color:var(--wh)}
.rjc .role-label{color:var(--st)}
.rjc .role-title{color:var(--ch)}
.rjc .role-sub{color:var(--mid)}
.rjc .role-module{background:var(--stp);border:1px solid var(--stl)}
.rjc .role-module-num{color:var(--st)}
.rjc .role-module-name{color:var(--ch)}
.rjc .role-cta{background:var(--ch);color:var(--wh)}
.rjc .role-bg{color:var(--ch)}
.role-divider{position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--lt);pointer-events:none;z-index:2}

/* ── STEP SHELL ── */
.shell{min-height:100vh;display:flex;flex-direction:column;padding-bottom:100px}
.snav{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--lt);position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(8px)}
.snav.sp-nav{border-bottom:2px solid var(--ch)}
.snav.jc-nav{border-bottom:2px solid var(--st)}
.snav-left{display:flex;align-items:center;gap:12px}
.s-back{font-family:var(--mono);font-size:9px;color:var(--mid);cursor:pointer;background:none;border:none;letter-spacing:1px;display:flex;align-items:center;gap:4px;padding:4px 0}
.s-back:hover{color:var(--ch)}
.s-brand{font-family:var(--serif);font-size:15px;color:var(--ch)}
.s-sep{width:1px;height:16px;background:var(--lt)}
.s-badge{font-family:var(--mono);font-size:8px;letter-spacing:2px;padding:3px 8px;border-radius:1px;text-transform:uppercase}
.sp-badge{background:var(--ch);color:var(--wh)}
.jc-badge{background:var(--st);color:var(--wh)}
.sh-badge{background:var(--lt);color:var(--mid)}
.s-counter{font-family:var(--mono);font-size:9px;color:var(--mid);letter-spacing:1px}
.s-exit{font-family:var(--mono);font-size:9px;color:var(--mid);background:none;border:none;cursor:pointer;letter-spacing:1px}
.s-exit:hover{color:var(--ch)}
.prog{height:3px;background:var(--lt)}
.prog-fill{height:100%;transition:width .4s ease}
.sp-prog{background:var(--ch)}
.jc-prog{background:var(--st)}
.sh-prog{background:var(--mid)}
.sbody{flex:1;padding:40px 24px 80px;max-width:820px;margin:0 auto;width:100%}
.sfooter{position:fixed;bottom:44px;left:0;right:0;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--lt);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;z-index:1000}
.sfooter-hint{font-family:var(--mono);font-size:9px;color:var(--mid);letter-spacing:1px}
.nbtn{padding:10px 26px;font-family:var(--mono);font-size:10px;letter-spacing:2px;text-transform:uppercase;border:none;border-radius:2px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px}
.sp-nb{background:var(--ch);color:var(--wh)}.sp-nb:hover{background:var(--dk)}
.jc-nb{background:var(--st);color:var(--wh)}.jc-nb:hover{background:#2E4F66}
.sh-nb{background:var(--mid);color:var(--wh)}.sh-nb:hover{background:#555}
.nbtn:disabled{background:var(--lt);color:var(--mid);cursor:not-allowed}

/* ── STEP CONTENT ── */
.eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
.sp-ey{color:var(--ch)}.jc-ey{color:var(--st)}.sh-ey{color:var(--mid)}
.s-title{font-family:var(--serif);font-size:44px;font-weight:400;line-height:1.1;color:var(--ch);margin-bottom:8px}
.s-sub{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--mid);margin-bottom:28px;line-height:1.5}

/* ── COMPONENTS ── */
.card{background:var(--wh);border:1px solid var(--lt);border-radius:2px;overflow:hidden;margin-bottom:12px}
.card-hdr{padding:10px 16px;border-bottom:1px solid var(--lt);display:flex;align-items:center;justify-content:space-between}
.card-t{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--ch)}
.card-b{font-family:var(--mono);font-size:8px;padding:2px 7px;border-radius:1px;border:1px solid var(--lt);color:var(--mid);letter-spacing:1px}
.cbody{padding:16px}
.assume{margin:16px 0;padding:14px 16px;background:#FBF8EE;border:1px solid #E0D4A0;border-left:4px solid var(--warn);border-radius:0 2px 2px 0}
.assume-lbl{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--warn);text-transform:uppercase;margin-bottom:5px}
.assume-txt{font-size:12px;color:var(--ch);line-height:1.6}
.callout{padding:14px 16px;background:var(--pale);border-left:3px solid var(--ch);margin:14px 0;border-radius:0 2px 2px 0}
.callout-lbl{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--mid);margin-bottom:4px}
.callout-txt{font-size:13px;color:var(--ch);line-height:1.6}

/* ── VISION ── */
.v-hero{background:var(--ch);padding:28px;border-radius:2px;margin-bottom:14px;position:relative;overflow:hidden}
.v-hero::after{content:'Transformation OS';position:absolute;bottom:-20px;right:-8px;font-family:var(--serif);font-size:90px;color:rgba(255,255,255,.04);pointer-events:none;white-space:nowrap;line-height:1}
.v-tl{font-family:var(--serif);font-size:20px;font-style:italic;color:rgba(255,255,255,.9);line-height:1.55;margin-bottom:14px;max-width:560px}
.v-tl strong{font-style:normal;color:var(--wh)}
.v-ns{padding:11px 14px;background:rgba(255,255,255,.08);border-left:3px solid rgba(255,255,255,.3);font-size:13px;color:rgba(255,255,255,.7);line-height:1.5}
.three-vars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.vc{padding:24px 20px;border:1px solid var(--lt);border-radius:2px;background:var(--ch);position:relative;overflow:hidden}
.vc::after{content:attr(data-n);position:absolute;bottom:-16px;right:-4px;font-family:var(--serif);font-size:100px;color:rgba(255,255,255,.04);font-weight:300;line-height:1;pointer-events:none}
.vc-n{font-family:var(--mono);font-size:8px;color:rgba(255,255,255,.3);letter-spacing:2px;margin-bottom:10px;text-transform:uppercase}
.vc-name{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--wh);margin-bottom:10px;line-height:1.2}
.vc-body{font-size:12px;color:rgba(255,255,255,.55);line-height:1.7}

/* ── OS LAYERS ── */
.layer-stack{display:flex;flex-direction:column;gap:1px;border:1px solid var(--lt);border-radius:2px;overflow:hidden}
.layer-row{background:var(--wh);border-bottom:1px solid var(--lt);overflow:hidden}
.layer-row:last-child{border-bottom:none}
.layer-hdr{display:flex;align-items:center;gap:0;cursor:pointer;height:48px;background:var(--wh);transition:background .15s;user-select:none;position:relative}
.layer-hdr:hover{background:var(--pale)}
.layer-hdr::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ch)}
.layer-num{font-family:var(--mono);font-size:10px;color:var(--mid);width:44px;text-align:center;flex-shrink:0;letter-spacing:1px}
.layer-name{font-family:var(--serif);font-size:17px;font-weight:500;flex:1;padding:0 8px 0 4px;color:var(--ch)}
.layer-meta{font-family:var(--mono);font-size:8px;color:var(--mid);margin-right:10px;letter-spacing:.5px;white-space:nowrap}
.layer-chev{font-size:8px;color:var(--mid);width:32px;text-align:center;transition:transform .2s}
.layer-chev.open{transform:rotate(180deg)}
.layer-body{background:var(--pale);border-top:1px solid var(--lt);animation:fadeIn .2s ease}
.layer-body-inner{padding:16px 20px}
.layer-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:12px}
.ldg-section{padding:12px 14px;background:var(--wh);border-radius:2px;border:1px solid var(--lt)}
.ldg-title{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
.ldg-item{display:flex;gap:7px;font-size:12px;color:var(--ch);padding:2px 0;line-height:1.4}
.ldg-item::before{content:'—';color:var(--mid);flex-shrink:0}
.layer-trust{padding:10px 12px;background:var(--wh);border-radius:2px;border:1px solid var(--lt);border-left:3px solid var(--ch)}
.lt-label{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--ch);margin-bottom:4px}
.lt-text{font-size:12px;color:var(--mid);line-height:1.5}

/* ── CONTEXT CARD ── */
.ctx-card{padding:22px 24px;background:var(--ch);border-radius:2px;margin-bottom:14px;color:var(--wh)}
.ctx-label{font-family:var(--mono);font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:7px}
.ctx-client{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--wh);margin-bottom:3px}
.ctx-program{font-family:var(--serif);font-size:15px;font-style:italic;color:rgba(255,255,255,.55);margin-bottom:18px}
.ctx-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.ctx-item{padding:9px 11px;background:rgba(255,255,255,.06);border-radius:1px}
.ctx-il{font-family:var(--mono);font-size:7px;letter-spacing:2px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-bottom:3px}
.ctx-iv{font-size:12px;color:rgba(255,255,255,.82);line-height:1.4}

/* ── KOTTER STRIP ── */
.kstrip{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.kph{flex-shrink:0;padding:7px 10px;border:1px solid var(--lt);min-width:86px;text-align:center;background:var(--wh);cursor:pointer;transition:all .15s}
.kph:hover{border-color:var(--ch)}
.kph.active{border-color:var(--ch);background:var(--ch)}
.kp-s{font-family:var(--mono);font-size:7px;color:var(--mid);letter-spacing:1px;margin-bottom:2px}
.kph.active .kp-s{color:rgba(255,255,255,.45)}
.kp-n{font-family:var(--sans);font-size:9px;font-weight:500;color:var(--ch)}
.kph.active .kp-n{color:var(--wh)}

/* ── STAKEHOLDER MAP ── */
.smap{position:relative;height:274px;background:var(--pale);overflow:hidden;border:1px solid var(--lt);border-radius:2px}
.mgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.04) 1px,transparent 1px);background-size:34px 34px}
.maxl{position:absolute;font-family:var(--mono);font-size:7px;color:var(--mid);letter-spacing:1px}
.sn{position:absolute;transform:translate(-50%,-50%);cursor:pointer}
.snr{border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;border:2px solid var(--ch);background:var(--wh)}
.sn:hover .snr{transform:scale(1.2);box-shadow:0 2px 12px rgba(0,0,0,.14)}
.sn-lbl{position:absolute;top:calc(100% + 20px);left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--sans);font-size:8px;font-weight:500;color:var(--ch)}
.sn-role{position:absolute;top:calc(100% + 30px);left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:7px;color:var(--mid);white-space:nowrap}
.sn-tip{position:absolute;bottom:calc(100%+8px);left:50%;transform:translateX(-50%);background:var(--wh);border:1px solid var(--ch);border-radius:2px;padding:10px 12px;min-width:190px;max-width:240px;z-index:50;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.bigy{margin-top:7px;padding:7px 9px;background:var(--pale);border-left:2px solid var(--ch)}
.bigy-l{font-family:var(--mono);font-size:7px;letter-spacing:2px;color:var(--mid);margin-bottom:2px;text-transform:uppercase}
.bigy-t{font-size:11px;color:var(--ch);line-height:1.55;font-style:italic}

/* ── HERITAGE ── */
.hi{padding:10px 0;border-bottom:1px solid var(--lt);display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:padding .12s}
.hi:last-child{border-bottom:none}
.hi:hover{padding-left:4px}
.hsim{font-family:var(--serif);font-size:24px;font-weight:400;line-height:1;min-width:46px;text-align:center}
.hcl{font-family:var(--sans);font-size:10px;font-weight:600;color:var(--ch);margin-bottom:1px}
.hph{font-size:11px;color:var(--mid);margin-bottom:3px;font-style:italic}
.hle{font-size:11px;color:var(--ch);line-height:1.5;padding:4px 7px;background:var(--pale);border-left:2px solid var(--lt)}
.ob{font-family:var(--mono);font-size:8px;padding:2px 5px;border-radius:1px;border:1px solid;letter-spacing:1px;white-space:nowrap}
.oS{background:#F0F7F0;color:var(--ok);border-color:#C0DCC0}
.oP{background:#FBF7EE;color:var(--warn);border-color:#DDD0A0}
.oF{background:#FBF0EE;color:var(--risk);border-color:#DDB8B0}

/* ── CONFIDENCE ── */
.cring{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cinner{width:56px;height:56px;border-radius:50%;background:var(--wh);display:flex;align-items:center;justify-content:center;flex-direction:column;border:1px solid var(--lt)}
.cval{font-family:var(--serif);font-size:20px;font-weight:400;line-height:1;color:var(--ch)}
.clbl{font-family:var(--mono);font-size:6px;color:var(--mid)}
.ri{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--lt)}
.ri:last-child{border-bottom:none}
.rbw{width:64px;height:3px;background:var(--lt);border-radius:1px;overflow:hidden;flex-shrink:0}
.rb{height:100%;border-radius:1px}

/* ── JC CONTEXT ── */
.jcc{padding:18px 20px;background:var(--stp);border:1px solid var(--stl);border-left:4px solid var(--st);border-radius:0 2px 2px 0;margin-bottom:12px}
.jcc-l{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--st);text-transform:uppercase;margin-bottom:5px}
.jcc-t{font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ch);margin-bottom:3px}
.jcc-b{font-size:12px;color:var(--mid);line-height:1.6}

/* ── HYP CARDS ── */
.hyp-grid{display:flex;flex-direction:column;gap:9px}
.hyp-card{border:1px solid var(--lt);border-radius:2px;padding:14px 16px;cursor:pointer;transition:all .18s;background:var(--wh)}
.hyp-card:hover{border-color:var(--st);background:var(--stp)}
.hyp-card.sel{border-color:var(--st);background:var(--stp);border-left:4px solid var(--st)}

function DNAVisual(){
  // Animated double helix — two strands winding around a central axis
  // Epistemic strand (steel blue) + Behavioral strand (warm gold)
  const W=680, H=160;
  const cx=W/2;
  const steps=28; // number of base pairs
  const dx=W/steps;
  const amp=42; // helix amplitude
  const mid=H/2;

  // Generate helix points
  const points=Array.from({length:steps+1},(_,i)=>{
    const x=i*dx;
    const phase=(i/steps)*Math.PI*4; // two full rotations
    const y1=mid+Math.sin(phase)*amp;
    const y2=mid+Math.sin(phase+Math.PI)*amp; // opposite phase
    const depth1=Math.cos(phase); // -1 to 1, for visual depth
    const depth2=Math.cos(phase+Math.PI);
    return {x,y1,y2,depth1,depth2};
  });

  // Build SVG path strings for the two strands
  const strand1Path=points.map((p,i)=>i===0?`M${p.x},${p.y1}`:`L${p.x},${p.y1}`).join(' ');
  const strand2Path=points.map((p,i)=>i===0?`M${p.x},${p.y2}`:`L${p.x},${p.y2}`).join(' ');

  // Anomaly positions
  const anomalies=[{i:18,label:"E5: Conflict detected",color:"#D4A830"},{i:23,label:"B5: Sycophancy risk",color:"#C84B4B"}];

  return(
    <div className="dna-wrap">
      <svg className="dna-svg" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
        {/* Background grid */}
        <defs>
          <pattern id="dna-grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(0,0,0,.04)" strokeWidth="0.5"/>
          </pattern>
        </defs>
        <rect width={W} height={H} fill="url(#dna-grid)"/>

        {/* Base pair rungs — drawn first (behind strands) */}

              <circle cx={p.x} cy={mid} r="7" fill={a.color} opacity=".15"

        {/* Strand labels */}

        <text x={8} y={mid-5} fontSize="8" fontFamily="var(--mono)" fill="#3A6080" letterSpacing="1">EPISTEMIC STRAND</text>

function NeuralNet({baseNeurons,newNeurons,animated,compact}){
  // Layout — 5 columns: Input | H1 | H2 | H3 | Output
  // Inspired by the reference image: Input(orange) Hidden(blue) Output(red)
  const W=680, H=compact?260:320;
  const pad=compact?40:48;
  const cols=[pad, W*0.25, W*0.5, W*0.75, W-pad];
  const r=compact?14:17; // node radius

  // Input layer — AI Engine (orange tint, like reference)
  const inputNodes=[
    {y:H*0.28,label:"Heritage SLM",sub:"Retrieval"},
    {y:H*0.72,label:"LLM Engine",sub:"Reasoning"},
  ];

  // Hidden layer 1 — Past contributions
  const h1Nodes=[
    {y:H*0.18,label:"Maya K.",neurons:312},
    {y:H*0.40,label:"Tom S.",neurons:54},
    {y:H*0.62,label:"Amara L.",neurons:41},
    {y:H*0.84,label:"Pierre D.",neurons:28},
  ];

  // Hidden layer 2 — Implement memory
  const h2Nodes=[
    {y:H*0.22,label:"2023 Hyp",sub:"Heritage"},
    {y:H*0.45,label:"2022 Hyp",sub:"Heritage"},
    {y:H*0.68,label:"2021 Hyp",sub:"Heritage"},
  ];

  // Hidden layer 3 — Validated patterns
  const h3Nodes=[
    {y:H*0.30,label:"Pattern A",sub:"Coalition"},
    {y:H*0.55,label:"Pattern B",sub:"Incentive"},
    {y:H*0.80,label:"Pattern C",sub:"Resistance"},
  ];

  // Output — YOU
  const outputY=H*0.50;

  // Color scheme matching reference image
  const inputFill="#F5C6A0"; // orange tint
  const inputStroke="#D4845A";
  const hiddenFill="#90C4E8"; // blue
  const hiddenStroke="#4A8FBB";
  const outputFill=animated?"#C84B4B":"#E8B0B0"; // red — active when animated
  const outputStroke="#9B2A2A";

  // All connections
  const connections=[];
  inputNodes.forEach((a,ai)=>{
    h1Nodes.forEach((b,bi)=>{connections.push({x1:cols[0]+r,y1:a.y,x2:cols[1]-r,y2:b.y,layer:0});});
  });
  h1Nodes.forEach((a,ai)=>{
    h2Nodes.forEach((b,bi)=>{connections.push({x1:cols[1]+r,y1:a.y,x2:cols[2]-r,y2:b.y,layer:1});});
  });
  h2Nodes.forEach((a,ai)=>{
    h3Nodes.forEach((b,bi)=>{connections.push({x1:cols[2]+r,y1:a.y,x2:cols[3]-r,y2:b.y,layer:2});});
  });
  h3Nodes.forEach((a,ai)=>{
    connections.push({x1:cols[3]+r,y1:a.y,x2:cols[4]-r,y2:outputY,layer:3});
  });

  const labelY=compact?14:18;
  const subY=H-(compact?16:20);

  return(
    <div className="neural-net" style={{height:H+60}}>
      <svg viewBox={`0 0 ${W} ${H+40}`} style={{width:"100%",height:"100%"}}>
        {/* Layer label backgrounds (pill style like reference) */}
        {[{x:cols[0],w:60,label:"Input Layer",fill:"#FDE8D0",stroke:"#D4845A"},
          {x:(cols[1]+cols[3])/2,w:200,label:"Hidden Layers",fill:"#D0E8F5",stroke:"#4A8FBB"},
          {x:cols[4],w:72,label:"Output Layer",fill:"#F5D0D0",stroke:"#9B2A2A"},
        ].map((lbl,i)=>(
          <g key={i} transform={`translate(${lbl.x},${labelY})`}>
            <rect x={-lbl.w/2} y={-9} width={lbl.w} height={18} rx={9} fill={lbl.fill} stroke={lbl.stroke} strokeWidth="1"/>
            <text textAnchor="middle" y="5" fontSize="9" fontFamily="var(--mono)" fill={lbl.stroke} letterSpacing="0.5">{lbl.label}</text>
          </g>
        ))}

        {/* All connections */}
        {connections.map((c,i)=>(
          <line key={i} x1={c.x1} y1={c.y1+32} x2={c.x2} y2={c.y2+32}
            stroke={c.layer===3?outputStroke:c.layer<2?hiddenStroke:"#7BA7BC"}
            strokeWidth={animated&&c.layer===3?"1.2":"0.7"}
            opacity={animated?0.35:0.2}
            strokeDasharray={animated&&c.layer===3?"none":"none"}/>
        ))}

        {/* Input nodes */}
        {inputNodes.map((n,i)=>(
          <g key={i} transform={`translate(${cols[0]},${n.y+32})`}>
            <circle r={r} fill={inputFill} stroke={inputStroke} strokeWidth="1.5"/>
            <text y={-3} textAnchor="middle" fontSize="7" fontFamily="var(--mono)" fill={inputStroke} letterSpacing="0.3">{n.label.split(" ")[0]}</text>
            <text y={7} textAnchor="middle" fontSize="6" fontFamily="var(--mono)" fill={inputStroke} opacity=".7">{n.sub}</text>
            <text x={-r-4} y={4} textAnchor="end" fontSize="8" fontFamily="var(--sans)" fill="var(--mid)">●</text>
          </g>
        ))}

        {/* H1 nodes */}
        {h1Nodes.map((n,i)=>(
          <g key={i} transform={`translate(${cols[1]},${n.y+32})`}>
            <circle r={r} fill={hiddenFill} stroke={hiddenStroke} strokeWidth="1.5"
              opacity={animated?1:0.7}/>
            <text y={-3} textAnchor="middle" fontSize="7" fontFamily="var(--mono)" fill="#1A3A55" letterSpacing="0.3">{n.label}</text>
            <text y={7} textAnchor="middle" fontSize="7" fontFamily="var(--mono)" fill="#1A3A55" opacity=".8">{n.neurons}</text>
          </g>
        ))}

        {/* H2 nodes */}
        {h2Nodes.map((n,i)=>(
          <g key={i} transform={`translate(${cols[2]},${n.y+32})`}>
            <circle r={r} fill={hiddenFill} stroke={hiddenStroke} strokeWidth="1.5" opacity={animated?1:0.7}/>
            <text y={-3} textAnchor="middle" fontSize="7" fontFamily="var(--mono)" fill="#1A3A55" letterSpacing="0.3">{n.label}</text>
            <text y={7} textAnchor="middle" fontSize="6" fontFamily="var(--mono)" fill="#1A3A55" opacity=".7">{n.sub}</text>
          </g>
        ))}

        {/* H3 nodes */}
        {h3Nodes.map((n,i)=>(
          <g key={i} transform={`translate(${cols[3]},${n.y+32})`}>
            <circle r={r} fill={hiddenFill} stroke={hiddenStroke} strokeWidth="1.5" opacity={animated?1:0.7}/>
            <text y={-3} textAnchor="middle" fontSize="7" fontFamily="var(--mono)" fill="#1A3A55" letterSpacing="0.3">{n.label}</text>
            <text y={7} textAnchor="middle" fontSize="6" fontFamily="var(--mono)" fill="#1A3A55" opacity=".7">{n.sub}</text>
          </g>
        ))}

        {/* Output node — YOU */}
        <g transform={`translate(${cols[4]},${outputY+32})`}>
          {animated&&<circle r={r+8} fill="none" stroke={outputStroke} strokeWidth="1" opacity=".3" className="nn-you-ring"/>}
          <circle r={r} fill={outputFill} stroke={outputStroke} strokeWidth="2"
            style={{transition:"fill .5s"}}/>
          <text y={-4} textAnchor="middle" fontSize="8" fontFamily="var(--sans)" fontWeight="600" fill="white">YOU</text>
          <text y={7} textAnchor="middle" fontSize="8" fontFamily="var(--mono)" fill="white">{animated?newNeurons:baseNeurons}</text>
          <text x={r+6} y={4} textAnchor="start" fontSize="9" fontFamily="var(--sans)" fill="var(--mid)">→</text>
        </g>

        {/* Sub-labels */}
        <text x={cols[0]} y={subY+32} textAnchor="middle" fontSize="8" fontFamily="var(--mono)" fill="var(--mid)" letterSpacing="0.5">AI Engine</text>
        <text x={cols[1]} y={subY+32} textAnchor="middle" fontSize="8" fontFamily="var(--mono)" fill="var(--mid)" letterSpacing="0.5">Consultants</text>
        <text x={cols[2]} y={subY+32} textAnchor="middle" fontSize="8" fontFamily="var(--mono)" fill="var(--mid)" letterSpacing="0.5">Memory</text>
        <text x={cols[3]} y={subY+32} textAnchor="middle" fontSize="8" fontFamily="var(--mono)" fill="var(--mid)" letterSpacing="0.5">Patterns</text>
        <text x={cols[4]} y={subY+32} textAnchor="middle" fontSize="8" fontFamily="var(--mono)" fill={outputStroke} letterSpacing="0.5">Output</text>
      </svg>
    </div>
  );
}

function JC2({onNext,onBack,onExit,selectedHyp,setNeuronsEarned}){
  const hyp=HYP_DATA.find(h=>h.id===selectedHyp)||HYP_DATA[0];
  const [action,setAction]=useState(null);
  const [msgs,setMsgs]=useState([]);
  const [input,setInput]=useState("");
  const [rounds,setRounds]=useState(0);
  const [localN,setLocalN]=useState(0);
  const canProceed=action!==null&&(action!=="debate"||(action==="debate"&&rounds>=1));

  const startDebate=()=>{
    setAction("debate");
    setMsgs([{r:"ai",t:`Confidence: ${hyp.conf}% — Heritage-grounded. My counter-argument: ${hyp.counter} What is your response to this?`}]);
  };
  const submit=()=>{
    if(!input.trim()) return;
    const earned=rounds===0?3:5;
    setMsgs(p=>[...p,{r:"jc",t:input},{r:"ai",t:AI_REPLIES[rounds%AI_REPLIES.length]}]);
    setRounds(r=>r+1);
    setLocalN(n=>n+earned);
    setNeuronsEarned(prev=>prev+earned);
    setInput("");
  };
  const accept=()=>{setAction("accepted");setLocalN(hyp.neurons);setNeuronsEarned(p=>p+hyp.neurons);};
  const challenge=()=>{setAction("challenged");setLocalN(2);setNeuronsEarned(p=>p+2);};

  return(
    <Shell persona="jc" step={4} total={6} onNext={onNext} onBack={onBack} onExit={onExit}
      nextLabel="See Your Contribution"
      nextDis={!canProceed}
      hint={canProceed?"":"Accept, debate, modify, or challenge to continue"}>
      <div className="eyebrow jc-ey">Debate Arena</div>
      <div className="s-title">The AI has argued.<br/>Now you decide.</div>
      <div className="s-sub">Read Model A's case and Model B's challenge. Choose your move.</div>

      <div className="d-models">
        <div className="d-model">
          <div className="d-mhdr">
            <div><div className="d-mn">Model A — Hypothesis</div><div className="d-mr">LLM · Heritage-grounded</div></div>
            <div style={{display:"flex",gap:5,alignItems:"center"}}>
              <div className={`tb tier-${hyp.tier}`}>{hyp.tierLabel}</div>
              <div style={{fontFamily:"var(--serif)",fontSize:17,color:hyp.conf>85?"var(--ok)":"var(--warn)"}}>{hyp.conf}%</div>
            </div>
          </div>
          <div className="d-out">{hyp.statement}</div>
          <div className="d-meta"><div className="d-mi">Evidence: <span className="d-mv">{hyp.evidence.substring(0,60)}...</span></div></div>
        </div>
        <div className="d-model mb">
          <div className="d-mhdr bh">
            <div><div className="d-mn" style={{color:"var(--risk)"}}>Model B — Red Team</div><div className="d-mr">Adversarial · Find the flaw</div></div>
            <div className="tb tier-I">Inference</div>
          </div>
          <div className="d-out">{hyp.counter}</div>
          <div className="d-meta"><div className="d-mi">DNA B5: <span className="d-mv">satisfied</span></div></div>
        </div>
      </div>

      {action===null&&(
        <div className="d-acts">
          <button className="da da-acc" onClick={accept}>✓ Accept</button>
          <button className="da da-deb" onClick={startDebate}>⚔ Debate AI</button>
          <button className="da da-mod" onClick={()=>setAction("modify")}>✎ Modify</button>
          <button className="da da-chl" onClick={challenge}>✕ Challenge</button>
        </div>
      )}

      {action==="accepted"&&<div style={{padding:"9px 12px",background:"#F0F7F0",border:"1px solid #C0DCC0",borderRadius:2,marginBottom:12,fontFamily:"var(--mono)",fontSize:9,color:"var(--ok)"}}>✓ Accepted — +{hyp.neurons} neurons earned · Recorded in Heritage flywheel</div>}
      {action==="challenged"&&<div style={{padding:"9px 12px",background:"var(--stp)",border:"1px solid var(--stl)",borderRadius:2,marginBottom:12,fontFamily:"var(--mono)",fontSize:9,color:"var(--st)"}}>✕ Challenged — +2 neurons · Dissent recorded permanently</div>}

      {action==="debate"&&(
        <div className="arena">
          <div className="arena-hdr"><span>⚔ Debate Arena — {hyp.title.substring(0,42)}...</span><span style={{color:"var(--mid)",fontWeight:400}}>{rounds} rounds · +{localN} neurons</span></div>
          <div className="arena-msgs">
            {msgs.map((m,i)=>(
              <div key={i} className={`dmsg ${m.r==="ai"?"dmsg-ai":"dmsg-jc"}`}>
                <div className="dmsg-l" style={{color:m.r==="ai"?"var(--ch)":"var(--st)"}}>{m.r==="ai"?"Kotter Engine":"You"}</div>
                {m.t}
              </div>
            ))}
          </div>
          <div className="arena-inp">
            <textarea className="arena-ta" placeholder="State your counter-argument. Reference Heritage evidence, stakeholder context, or Kotter principles..." value={input} onChange={e=>setInput(e.target.value)}/>

              <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--mid)"}}>Round {rounds+1} · +{rounds===0?3:5} neurons</div>
              <button className="sub-btn" onClick={submit}>Submit →</button>
            </div>
          </div>
        </div>
      )}

      {action==="modify"&&(
        <div style={{padding:12,background:"#FBF7EE",border:"1px solid #DDD0A0",borderRadius:2,marginBottom:12}}>
          <div style={{fontFamily:"var(--mono)",fontSize:8,color:"var(--warn)",letterSpacing:1,marginBottom:7,textTransform:"uppercase"}}>Modify Hypothesis — Your version will be tracked against the original</div>
          <textarea className="arena-ta" rows={4} placeholder="Rewrite the hypothesis. If your version outperforms the original, you earn bonus neurons and permanent attribution..."/>
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:7}}>
            <button className="da da-acc" onClick={()=>{setAction("modified");setLocalN(hyp.neurons+5);setNeuronsEarned(p=>p+hyp.neurons+5);}}>Submit Modification (+{hyp.neurons+5} neurons)</button>
          </div>
        </div>
      )}
      {action==="modified"&&<div style={{padding:"9px 12px",background:"#FBF7EE",border:"1px solid #DDD0A0",borderRadius:2,marginBottom:12,fontFamily:"var(--mono)",fontSize:9,color:"var(--warn)"}}>✎ Modification submitted — +{hyp.neurons+5} neurons · Tracked for outcome validation</div>}

      <div style={{marginTop:12,border:"1px solid var(--stl)",borderRadius:2,overflow:"hidden"}}>
        {[["Heritage Evidence","var(--ch)",hyp.evidence],["Kotter Principle","var(--ch)",hyp.principle],["Success Criteria","var(--ok)",hyp.success]].map(([lbl,c,txt])=>(
          <div key={lbl} style={{padding:"10px 14px",borderBottom:"1px solid var(--stl)"}}>
            <div style={{fontFamily:"var(--mono)",fontSize:8,letterSpacing:2,color:"var(--mid)",textTransform:"uppercase",marginBottom:4}}>{lbl}</div>
            <div style={{fontSize:12,color:c,lineHeight:1.6,fontStyle:"italic"}}>{txt}</div>
          </div>
        ))}
      </div>
    </Shell>
  );
}

function JC3({onNext,onBack,onExit,neuronsEarned,selectedHyp}){
  const hyp=HYP_DATA.find(h=>h.id===selectedHyp)||HYP_DATA[0];
  const base=67,total=base+neuronsEarned;
  const [animated,setAnimated]=useState(false);
  useEffect(()=>{const t=setTimeout(()=>setAnimated(true),500);return()=>clearTimeout(t);},[]);
  return(
    <Shell persona="jc" step={5} total={6} onNext={onNext} onBack={onBack} onExit={onExit}
      nextLabel="View Reflection" hint="Your contribution is now permanent">
      <div className="eyebrow jc-ey">Neuron Reveal</div>
      <div className="s-title">You just contributed<br/>to the Heritage.</div>
      <div className="s-sub">Permanently. Attributed to you. Visible to every future consultant who faces this pattern.</div>

      <div className="n-ba">
        <div className="n-state">
          <div className="n-lbl">Before this debate</div>
          <div className="n-count" style={{color:"var(--mid)"}}>{base}</div>
          <div className="n-layer" style={{color:"var(--mid)"}}>Hidden Layer 1</div>
        </div>
        <div className="n-arrow">→</div>
        <div className="n-state after">
          <div className="n-lbl" style={{color:"var(--st)"}}>After this debate</div>
          <div className="n-count" style={{color:"var(--st)"}}>{animated?total:base}</div>
          <div className="n-layer" style={{color:"var(--st)"}}>Hidden Layer 1 · {150-total} to next layer</div>
        </div>
      </div>

      <div className="n-earned">+{neuronsEarned} neurons earned</div>
      <div className="n-msg">Your debate on "{hyp.title.substring(0,48)}..." is now wired into the network. The lines below show what that means.</div>

      <NeuralNet baseNeurons={base} newNeurons={total} animated={animated}/>

      <div style={{fontSize:12,color:"var(--mid)",textAlign:"center",lineHeight:1.6,marginBottom:16,fontStyle:"italic"}}>
        Left: AI Engine nodes that grounded your debate with Heritage evidence.<br/>
        Right: Implement talent pool — every consultant who has contributed before you.<br/>
        Centre: You — now connected to both sides permanently.
      </div>

      <div className="n-stats">
        {[["7","Debates","var(--st)"],["71%","Win rate","var(--ok)"],["3","SP adopted","var(--ch)"],["Hidden 1","Current layer","var(--st)"]].map(([v,l,c])=>(
          <div key={l} className="n-stat">
            <div className="n-sv" style={{color:c}}>{v}</div>
            <div className="n-sl">{l}</div>
          </div>
        ))}
      </div>
    </Shell>
  );
}

function JC4({onBack,onExit}){
  return(
    <Shell persona="jc" step={6} total={6} onNext={onExit} onBack={onBack} onExit={onExit}
      nextLabel="Done — Exit" hint="Your contribution is permanent">
      <div className="eyebrow jc-ey">Reflection</div>
      <div className="s-title">What just happened.<br/>In plain language.</div>
      <div className="s-sub">And why it matters for your career at Implement.</div>
      <div style={{padding:"22px 24px",background:"var(--st)",borderRadius:2,marginBottom:16}}>
        <div style={{fontFamily:"var(--serif)",fontSize:18,fontStyle:"italic",color:"rgba(255,255,255,.9)",lineHeight:1.6}}>"The AI argued. You pushed back. The engine recorded both. That exchange is now part of Implement's Heritage — attributed to you."</div>
      </div>
      <div className="ref-grid">
        {[{n:"01",insight:"You challenged institutional intelligence — and made it better.",body:"Your counter-argument introduced a contextual gap the engine had not accounted for. That gap is now logged. The next consultant facing this pattern benefits from what you noticed."},
          {n:"02",insight:"Your judgment has a permanent track record.",body:"Win rate, hypothesis quality, SP adoption rate — these compound over your career at Implement. Not performance reviews. Real outcomes, permanently attributed."},
          {n:"03",insight:"This is not what junior consulting used to look like.",body:"In the old model, the Senior Partner's reasoning was inaccessible. The Big Y changes that. You can see the reasoning, challenge it, and contribute your own. That is the upgrade."},
        ].map((r,i)=>(
          <div key={i} className="ref-card" style={{borderColor:"var(--stl)"}}>
            <div className="ref-n" style={{color:"var(--st)"}}>{r.n}</div>
            <div className="ref-i">{r.insight}</div>
            <div className="ref-b">{r.body}</div>
          </div>
        ))}
      </div>
      <div style={{padding:"16px 20px",background:"var(--ch)",borderRadius:2,display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,marginBottom:14}}>
        <div>
          <div style={{fontFamily:"var(--serif)",fontSize:17,fontWeight:400,color:"var(--wh)",marginBottom:4}}>You've reached the end of the path.</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,.5)",lineHeight:1.6}}>Your reaction takes 8 minutes and directly shapes what gets built next.</div>
        </div>
        <a href="./fieldbrief.html" target="_blank" rel="noopener noreferrer"
          style={{padding:"10px 22px",background:"var(--wh)",color:"var(--ch)",borderRadius:2,fontFamily:"var(--mono)",fontSize:10,letterSpacing:"1.5px",textTransform:"uppercase",textDecoration:"none",whiteSpace:"nowrap",flexShrink:0}}>
          Open Field Brief →
        </a>
      </div>
    </Shell>
  );
}

/* ══════════════════════════════════
   APP
══════════════════════════════════ */
function App(){
  const [screen,setScreen]=useState("land");
  const [foundStep,setFoundStep]=useState(1);
  const [role,setRole]=useState(null);
  const [spStep,setSPStep]=useState(1);
  const [jcStep,setJCStep]=useState(1);
  const [selHyp,setSelHyp]=useState(null);
  const [neurons,setNeurons]=useState(0);

  const goLand=()=>{setScreen("land");setFoundStep(1);setRole(null);setSPStep(1);setJCStep(1);setSelHyp(null);setNeurons(0);};

  // Landing
  if(screen==="land") return(
    <><GS/><div className="app"><Landing onStart={()=>setScreen("found")}/></div></>
  );

  // Foundation steps
  if(screen==="found"){
    if(foundStep===1) return(
      <><GS/><F1 onNext={()=>setFoundStep(2)} onBack={goLand} onExit={goLand}/></>
    );
    if(foundStep===2) return(
      <><GS/><F2 onNext={()=>setScreen("role")} onBack={()=>setFoundStep(1)} onExit={goLand}/></>
    );
  }

  // Role selector
  if(screen==="role") return(
    <><GS/><div className="app"><RoleSel onSelect={r=>{setRole(r);setScreen(r);}} onBack={()=>{setScreen("found");setFoundStep(2);}}/></div></>
  );

  // SP path
  if(screen==="sp"){
    const back=spStep===1?()=>{setScreen("role");}:()=>setSPStep(s=>s-1);
    const next=()=>setSPStep(s=>s+1);
    if(spStep===1) return <><GS/><SP1 onNext={next} onBack={back} onExit={goLand}/></>;
    if(spStep===2) return <><GS/><SP2 onNext={next} onBack={back} onExit={goLand}/></>;
    if(spStep===3) return <><GS/><SP3 onNext={next} onBack={back} onExit={goLand}/></>;
    if(spStep===4) return <><GS/><SP4 onNext={next} onBack={back} onExit={goLand}/></>;
    if(spStep===5) return <><GS/><SP5 onBack={back} onExit={goLand}/></>;
  }

  // JC path
  if(screen==="jc"){
    const back=jcStep===1?()=>setScreen("role"):()=>setJCStep(s=>s-1);
    const next=()=>setJCStep(s=>s+1);
    if(jcStep===1) return <><GS/><JC1 onNext={next} onBack={back} onExit={goLand} selectedHyp={selHyp} setSelectedHyp={setSelHyp}/></>;
    if(jcStep===2) return <><GS/><JC2 onNext={next} onBack={back} onExit={goLand} selectedHyp={selHyp} setNeuronsEarned={setNeurons}/></>;
    if(jcStep===3) return <><GS/><JC3 onNext={next} onBack={back} onExit={goLand} neuronsEarned={neurons} selectedHyp={selHyp}/></>;
    if(jcStep===4) return <><GS/><JC4 onBack={back} onExit={goLand}/></>;
  }

  return <><GS/><div className="app"><Landing onStart={()=>setScreen("found")}/></div></>;
}
