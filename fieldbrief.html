const SHEETS_URL='https://script.google.com/macros/s/AKfycbzb3c9-AMO8PZjxAq4lfShNs_4SGawNf3zDkPObK_P64JMqx2G5qCNEBPyZtwL4rNSfgw/exec';

async function saveResponse(data){
  try{
    const payload={
      timestamp: new Date().toISOString(),
      respondent: data.identity ? data.identity.name||'Anonymous' : 'Anonymous',
      role:       data.identity ? data.identity.role||'' : '',
      anonymous:  String(!data.identity),
      belief:     data.belief||'',
      fit_strategic:  String(data.agrees?.strategicFit||''),
      fit_replicable: String(data.agrees?.replicability||''),
      fit_jc:         String(data.agrees?.jcTransformation||''),
      layer_clarity:    JSON.stringify(data.layerClarity||{}),
      layer_importance: JSON.stringify(data.layerImportance||{}),
      duel_r1: data.bracketWinners?.r1||'',
      duel_r2: data.bracketWinners?.r2||'',
      duel_r3: data.bracketWinners?.r3||'',
      must_have: data.mustHave||'',
      blocker:   data.blocker||'',
    };
    const NEW_URL='https://script.google.com/macros/s/AKfycbzVoiH-INw8i24l1Rxjhh-SPRPq-xeKRze3GBUmKB5fFFNJ_cMq1W4-QVWN0Nhm-Cn6Mg/exec';
    const params=new URLSearchParams(payload).toString();
    // GET request — works from file:// with zero CORS issues
    await fetch(`${NEW_URL}?${params}`,{method:'GET',mode:'no-cors'});
    return true;
  }catch(e){
    console.error('Sheets error:',e);
    return false;
  }
}

// Results dashboard reads from a local session cache
// (Google Sheets does not support public GET without auth)
// Responses submitted in this browser session are shown live.
const SESSION_CACHE_KEY='tos_session_responses';

function cacheResponse(data){
  try{
    const existing=JSON.parse(sessionStorage.getItem(SESSION_CACHE_KEY)||'[]');
    existing.push({...data,timestamp:new Date().toISOString()});
    sessionStorage.setItem(SESSION_CACHE_KEY,JSON.stringify(existing));
  }catch(e){}
}

async function loadResponses(){
  try{
    return JSON.parse(sessionStorage.getItem(SESSION_CACHE_KEY)||'[]');
  }catch(e){return [];}
}

function ParticipantView(){
  const [step,setStep]=useState('brief'); // brief | instruments | done
  const [identity,setIdentity]=useState(false);
  const [name,setName]=useState('');
  const [role,setRole]=useState('');

  // Instrument state
  const [belief,setBelief]=useState('');
  const [agrees,setAgrees]=useState({0:null,1:null,2:null});
  const [layerClarity,setLayerClarity]=useState({});
  const [layerImportance,setLayerImportance]=useState({});
  const [bracketWinners,setBracketWinners]=useState({0:null,1:null,2:null});
  const [mustHave,setMustHave]=useState('');
  const [blocker,setBlocker]=useState('');
  const [submitting,setSubmitting]=useState(false);
  const [submitError,setSubmitError]=useState(false);

  // Bracket logic
  const getR3A=()=>{
    const w0=bracketWinners[0];
    if(!w0) return {id:'?',name:'Winner of Round 1',sub:'Complete Round 1 first'};
    return BRACKET_ROUNDS[0][w0==='a'?'a':'b'];
  };

  const progress=step==='brief'?15:
    (Object.values(agrees).filter(v=>v!==null).length/3*25+
     (belief?10:0)+
     (Object.keys(layerClarity).length/6*10)+
     (Object.values(bracketWinners).filter(v=>v!==null).length/3*15)+
     ((mustHave&&blocker)?15:0))+15;

  const canSubmit=belief&&
    Object.values(agrees).every(v=>v!==null)&&
    mustHave&&blocker&&
    Object.values(bracketWinners).every(v=>v!==null);

  const submit=async()=>{
    setSubmitting(true);
    const payload={
      identity:identity?{name,role}:null,
      belief,
      agrees:{
        strategicFit:agrees[0],
        replicability:agrees[1],
        jcTransformation:agrees[2],
      },
      layerClarity,layerImportance,
      bracketWinners:{
        r1:bracketWinners[0]===null?null:BRACKET_ROUNDS[0][bracketWinners[0]==='a'?'a':'b'].id,
        r2:bracketWinners[1]===null?null:BRACKET_ROUNDS[1][bracketWinners[1]==='a'?'a':'b'].id,
        r3:bracketWinners[2]===null?null:(bracketWinners[2]==='a'?getR3A().id:'F5'),
      },
      mustHave,blocker,
    };
    const ok=await saveResponse(payload);
    if(ok) cacheResponse(payload);
    setSubmitting(false);
    if(ok) setStep('done');
    else setSubmitError(true);
  };

  if(step==='done') return(
    <div className="wrap">
      <div className="thankyou">
        <div className="ty-icon">◈</div>
        <div className="ty-title">Thank you.</div>
        <div className="ty-sub">Your response has been recorded. Every signal shapes what we build — and your contribution is permanently part of that process.</div>
      </div>
    </div>
  );

  return(
    <div className="wrap">
      <div className="progress-bar"><div className="progress-fill" style={{width:`${Math.min(100,progress)}%`}}/></div>

      {/* HERO */}
      <div className="hero">
        <div className="hero-label">Implement Consulting Group · Field Brief</div>
        <div className="hero-title">Transformation OS<br/>& Kotter Engine</div>
        <div className="hero-sub">You are being asked to help shape a product that could fundamentally change how Implement competes. This is not a demo. It is a working prototype built on a strategic thesis. Read the brief. Experience the prototype. Tell us what you think.</div>
        <div className="hero-tagline">"To build intelligence fit for clients, you must build it fit for consultants."</div>
      </div>

      {/* BRIEF */}
      <div className="card">
        <div className="card-hdr"><div className="card-title">01 · The Hypothesis</div></div>
        <div className="card-body">
          <div style={{fontSize:14,lineHeight:1.75,color:'var(--charcoal)',marginBottom:14}}>
            Implement is sitting on a Heritage AI goldmine: decades of proprietary, ground-truth data on human behavioral change and organisational resistance. <strong>AI tool augmentation is not a strategy.</strong>
          </div>
          <div style={{padding:'14px 16px',background:'var(--pale)',borderLeft:'3px solid var(--charcoal)',borderRadius:'0 2px 2px 0',marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:600,color:'var(--charcoal)',marginBottom:8,letterSpacing:'.5px',textTransform:'uppercase',fontFamily:'var(--f-mono)'}}>Three interlocking variables</div>
            {['A culture of high agency — consultants bring passion, mastery, creativity, and entrepreneurial spirit. Quality of thinking compounds with every person and every year.',
              'A relentless focus on real outcomes through effective change — not frameworks, not reports, but transformation that holds. Client trust compounds with every engagement.',
              'A meaningful use of technology — AI that amplifies human judgment, never substitutes for it. Institutional intelligence compounds with every hypothesis debated and every outcome recorded.'
            ].map((t,i)=>(
              <div key={i} style={{display:'flex',gap:10,marginBottom:8,fontSize:13,color:'var(--charcoal)',lineHeight:1.6}}>
                <span style={{fontFamily:'var(--f-mono)',fontSize:10,color:'var(--mid)',flexShrink:0,paddingTop:2}}>{i+1}.</span>{t}
              </div>
            ))}
          </div>
          <div style={{fontSize:13,color:'var(--mid)',fontStyle:'italic',lineHeight:1.6}}>These three variables reinforce each other. High agency produces better hypotheses. Better hypotheses produce better outcomes. Better outcomes deepen the Heritage corpus. The fit between them is what makes the position difficult to replicate.</div>
        </div>
      </div>

      {/* ARCHITECTURE */}
      <div className="card">
        <div className="card-hdr"><div className="card-title">02 · Six-Layer OS Architecture</div></div>
        <div className="card-body" style={{paddingBottom:4}}>
          {LAYERS.map((l,i)=>(
            <div key={i} className="layer-row">
              <div className="layer-num-badge">{l.num}</div>
              <div className="layer-bar"/>
              <div style={{flex:1}}>
                <div className="layer-name">{l.name}</div>
                <div className="layer-desc">{l.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* KILLER FEATURES */}
      <div className="card">
        <div className="card-hdr"><div className="card-title">03 · Five Killer Features</div></div>
        <div className="card-body">
          <div className="feature-grid">
            {FEATURES.map((f,i)=>(
              <div key={i} className="feature-card">
                <div className="feature-num">{f.num}</div>
                <div className="feature-name">{f.name}</div>
                <div className="feature-desc">{f.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* PROTOTYPE LINK */}
      <div className="card">
        <div className="card-hdr"><div className="card-title">04 · Experience the Prototype</div></div>
        <div className="card-body">
          <div className="proto-box">
            <div className="proto-text">
              <div className="proto-title">Transformation OS — Interactive Prototype</div>
              <div className="proto-sub">The prototype is in the same folder as this file. Open <strong>kotter-engine.html</strong> in your browser. The experience begins on a landing screen — choose your role (Senior Partner or Junior Consultant) and follow the guided steps. Come back here to complete the instruments below.</div>
            </div>
            <div style={{flexShrink:0,padding:'10px 18px',background:'var(--charcoal)',color:'white',borderRadius:2,fontFamily:'var(--f-mono)',fontSize:10,letterSpacing:'1.5px',textTransform:'uppercase',whiteSpace:'nowrap'}}>kotter-engine.html</div>
          </div>
          <div style={{marginTop:10,padding:'10px 12px',background:'var(--pale)',border:'1px solid var(--light)',borderRadius:2}}>
            <div style={{fontFamily:'var(--f-mono)',fontSize:9,color:'var(--charcoal)',letterSpacing:1,textTransform:'uppercase',marginBottom:5}}>Suggested path through the prototype</div>
            {['Step 1 — Product Vision: read the hypothesis and strategic fit (2 min)',
              'Step 2 — OS Architecture: expand each of the 6 layers to understand the engine (3 min)',
              'Step 3 — Choose your role: Senior Partner for the War Room experience, Junior Consultant for the Hypothesis Engine',
              'Step 4 — Complete all steps in your chosen path, then return here to respond'
            ].map((s,i)=>(
              <div key={i} style={{display:'flex',gap:8,fontSize:11,color:'var(--mid)',padding:'3px 0',borderBottom:'1px solid var(--light)'}}>
                <span style={{color:'var(--charcoal)',flexShrink:0}}>→</span>{s}
              </div>
            ))}
          </div>
        </div>
      </div>

      {/* ═══ INSTRUMENTS ═══ */}
      <div className="card">
        <div className="card-hdr">
          <div className="card-title">05 · Your Response</div>
          <div style={{fontFamily:'var(--f-mono)',fontSize:9,color:'var(--mid)',letterSpacing:1}}>~8 minutes</div>
        </div>
        <div className="card-body">

          {/* INSTRUMENT 1 — BELIEF CHECK */}
          <div className="instrument">
            <div className="inst-label"><span className="inst-num">I · 01</span>Belief Check</div>
            <div className="inst-question">Complete this sentence:</div>
            <div className="belief-prefix">The most defensible thing about this product is...</div>
            <textarea className="belief-input" rows={3}
              placeholder="Write what comes to mind first. There is no wrong answer."
              value={belief} onChange={e=>setBelief(e.target.value)}/>
          </div>

          {/* INSTRUMENT 2 — STRATEGIC FIT */}
          <div className="instrument">
            <div className="inst-label"><span className="inst-num">I · 02</span>Strategic Fit Test</div>
            <div className="inst-question">Rate your agreement with each statement.</div>
            {STATEMENTS.map((s,i)=>(
              <div key={i} className="agree-row">
                <div className="agree-statement">{s}</div>
                <AgreeScale value={agrees[i]} onChange={v=>setAgrees(a=>({...a,[i]:v}))}/>
              </div>
            ))}
          </div>

          {/* INSTRUMENT 3 — LAYER HEAT MAP */}
          <div className="instrument">
            <div className="inst-label"><span className="inst-num">I · 03</span>Layer Reaction</div>
            <div className="inst-question">Rate each OS layer on two dimensions.</div>
            <div className="inst-hint">This takes 60 seconds. Your gut reaction is more valuable than a considered opinion.</div>
            <div className="heatmap-row-hdr">
              <div style={{fontFamily:'var(--f-mono)',fontSize:8,color:'var(--mid)',letterSpacing:1,textTransform:'uppercase'}}>Layer</div>
              <div style={{fontFamily:'var(--f-mono)',fontSize:8,color:'var(--mid)',letterSpacing:1,textTransform:'uppercase',textAlign:'center'}}>Name clarity<br/><span style={{opacity:.6}}>Clear · Ok · Unclear</span></div>
              <div style={{fontFamily:'var(--f-mono)',fontSize:8,color:'var(--mid)',letterSpacing:1,textTransform:'uppercase',textAlign:'center'}}>Importance to you<br/><span style={{opacity:.6}}>High · Mid · Low</span></div>
            </div>
            {LAYERS.map((l,i)=>(
              <div key={i} className="heatmap-row">
                <div>
                  <span className="heatmap-num">{l.num}</span>
                  <span className="heatmap-name">{l.name}</span>
                </div>
                <div className="rating-btns" style={{justifyContent:'center'}}>
                  {['Clear','Ok','Unclear'].map((lbl,j)=>(
                    <div key={j}
                      className={`rating-btn${layerClarity[i]===j+1?` sel-${j+1}`:''}`}
                      onClick={()=>setLayerClarity(c=>({...c,[i]:j+1}))}>
                      {lbl}
                    </div>
                  ))}
                </div>
                <div className="rating-btns" style={{justifyContent:'center'}}>
                  {['High','Mid','Low'].map((lbl,j)=>(
                    <div key={j}
                      className={`rating-btn${layerImportance[i]===j+1?` sel-${j+1}`:''}`}
                      onClick={()=>setLayerImportance(c=>({...c,[i]:j+1}))}>
                      {lbl}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {/* INSTRUMENT 4 — FEATURE DUEL */}
          <div className="instrument">
            <div className="inst-label"><span className="inst-num">I · 04</span>Feature Duel</div>
            <div className="inst-question">If Implement could only build one — which would you choose?</div>
            <div className="inst-hint">Three rounds. One click each. Round 3 pits the winner of Round 1 against The Human Layer.</div>
            <div className="bracket-wrap">
              {BRACKET_ROUNDS.map((round,ri)=>{
                const optA=ri===2?getR3A():round.a;
                const optB=round.b;
                const winner=bracketWinners[ri];
                const r3Locked=ri===2&&!bracketWinners[0];
                return(
                  <div key={ri} className="bracket-round" style={r3Locked?{opacity:.4,pointerEvents:'none'}:{}}>
                    <div className="bracket-hdr">
                      <span>{round.round}{round.label?` — ${round.label}`:''}</span>
                      {r3Locked&&<span>Complete Round 1 first</span>}
                    </div>
                    <div className="bracket-match">
                      <div className={`bracket-option${winner==='a'?' chosen':winner!==null?' eliminated':''}`}
                        onClick={()=>setBracketWinners(w=>({...w,[ri]:'a'}))}>
                        <div className="bracket-feat-name">{optA.name}</div>
                        <div className="bracket-feat-sub">{optA.sub||optA.desc||''}</div>
                      </div>
                      <div className="bracket-vs">vs</div>
                      <div className={`bracket-option${winner==='b'?' chosen':winner!==null?' eliminated':''}`}
                        onClick={()=>setBracketWinners(w=>({...w,[ri]:'b'}))}>
                        <div className="bracket-feat-name">{optB.name}</div>
                        <div className="bracket-feat-sub">{optB.sub||optB.desc||''}</div>
                      </div>
                    </div>
                    {winner!==null&&(
                      <div className="bracket-winner">
                        <div className="bracket-winner-label">Your pick →</div>
                        <div className="bracket-winner-name">{winner==='a'?optA.name:optB.name}</div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* INSTRUMENT 5 — ONE SIGNAL */}
          <div className="instrument">
            <div className="inst-label"><span className="inst-num">I · 05</span>The One Signal</div>
            <div className="inst-question">Two questions. No word limit. These are the most important answers you'll give.</div>
            <div className="signal-pair">
              <div>
                <div className="signal-label">What is the one thing this product must do to earn a permanent place in your engagement workflow?</div>
                <textarea className="signal-textarea" placeholder="Be specific. Name a moment, a situation, a client type."
                  value={mustHave} onChange={e=>setMustHave(e.target.value)}/>
              </div>
              <div>
                <div className="signal-label">What is the one thing that would stop you from using it?</div>
                <textarea className="signal-textarea" placeholder="Be honest. This is the most valuable feedback we can receive."
                  value={blocker} onChange={e=>setBlocker(e.target.value)}/>
              </div>
            </div>
          </div>

          {/* IDENTITY */}
          <div className="identity-box">
            <div className="identity-row">
              <div>
                <div className="identity-label">Share your identity?</div>
                <div className="identity-sub">Anonymous by default. Toggle to add your name and role.</div>
              </div>
              <Toggle on={identity} onChange={()=>setIdentity(!identity)}/>
            </div>
            {identity&&(
              <div className="identity-fields">
                <input className="identity-input" placeholder="Your name" value={name} onChange={e=>setName(e.target.value)}/>
                <input className="identity-input" placeholder="Your role (e.g. Senior Partner)" value={role} onChange={e=>setRole(e.target.value)}/>
              </div>
            )}
          </div>

          {submitError&&<div style={{padding:'8px 12px',background:'#FBF0EE',border:'1px solid #DDB8B0',borderRadius:2,fontSize:12,color:'var(--risk)',marginBottom:10}}>Something went wrong saving your response. Please try again.</div>}

          <button className="submit-btn" disabled={!canSubmit||submitting} onClick={submit}>
            {submitting?'Submitting...':'Submit Response →'}
          </button>
          {!canSubmit&&<div style={{fontSize:11,color:'var(--mid)',marginTop:6,textAlign:'center',fontStyle:'italic'}}>Complete all five instruments to submit.</div>}

        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════
   RESULTS DASHBOARD
═══════════════════════════════════ */
function ResultsDashboard(){
  const [responses,setResponses]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);

  useEffect(()=>{
    loadResponses().then(r=>{setResponses(r);setLoading(false);});
  },[]);

  const refresh=async()=>{
    setLoading(true);
    const r=await loadResponses();
    setResponses(r);
    setLoading(false);
  };

  if(loading) return <div className="wrap"><div className="empty-state">Loading responses...</div></div>;

  const n=responses.length;

  // Agree averages
  const agreeAvg=(key)=>{
    const vals=responses.map(r=>r.agrees?.[key]).filter(v=>v!=null);
    if(!vals.length) return null;
    return (vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1);
  };

  // Feature duel tallies
  const featureTally={};
  FEATURES.forEach(f=>featureTally[f.id]=0);
  responses.forEach(r=>{
    if(r.bracketWinners){
      Object.values(r.bracketWinners).forEach(id=>{
        if(id&&featureTally[id]!==undefined) featureTally[id]++;
      });
    }
  });
  const sortedFeatures=Object.entries(featureTally).sort((a,b)=>b[1]-a[1]);

  // Layer importance tally
  const layerHighCount=LAYERS.map((_,i)=>{
    return responses.filter(r=>r.layerImportance&&r.layerImportance[i]===1).length;
  });

  const formatTime=(ts)=>{
    if(!ts) return '';
    const d=new Date(ts);
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  };

  return(
    <div className="wrap">
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,paddingBottom:14,borderBottom:'2px solid var(--charcoal)'}}>
        <div>
          <div style={{fontFamily:'var(--f-serif)',fontSize:24,fontWeight:500,color:'var(--charcoal)'}}>Results Dashboard</div>
          <div style={{fontFamily:'var(--f-mono)',fontSize:9,color:'var(--mid)',letterSpacing:2,marginTop:2}}>TRANSFORMATION OS · FIELD BRIEF</div>
        </div>
        <button onClick={refresh} style={{padding:'7px 14px',border:'1px solid var(--light)',borderRadius:2,background:'var(--white)',fontFamily:'var(--f-mono)',fontSize:9,letterSpacing:1,cursor:'pointer',color:'var(--mid)',textTransform:'uppercase'}}>↻ Refresh</button>
      </div>
      <div style={{padding:'10px 14px',background:'#EEF3F8',border:'1px solid #BDD0E0',borderRadius:2,marginBottom:16,fontSize:12,color:'var(--info)',lineHeight:1.6}}>
        <strong>All responses are saved to your Google Sheet in real time.</strong> This dashboard shows responses submitted in this browser session. To see all responses across all participants, open your Google Sheet directly at sheets.google.com.
      </div>

      {n===0?(
        <div className="empty-state">No responses yet. Share the participant link to start collecting.</div>
      ):(
        <>
          {/* SUMMARY STATS */}
          <div className="dash-grid">
            <div className="dash-stat"><div className="dash-val">{n}</div><div className="dash-label">Responses</div></div>
            <div className="dash-stat"><div className="dash-val">{responses.filter(r=>r.identity).length}</div><div className="dash-label">Identified</div></div>
            <div className="dash-stat"><div className="dash-val">{agreeAvg('strategicFit')??'—'}</div><div className="dash-label">Avg strategic fit score</div></div>
          </div>

          {/* BELIEF CHECK — OPEN TEXT */}
          <div className="card">
            <div className="card-hdr"><div className="card-title">I·01 · Belief Check — Open Text</div></div>
            <div className="card-body" style={{paddingBottom:4}}>
              {responses.map((r,i)=>(
                <div key={i} style={{marginBottom:10,padding:'10px 14px',background:'var(--pale)',borderLeft:'2px solid var(--charcoal)',borderRadius:'0 2px 2px 0'}}>
                  <div style={{fontFamily:'var(--f-mono)',fontSize:8,color:'var(--mid)',letterSpacing:1,marginBottom:4,textTransform:'uppercase'}}>
                    {r.identity?`${r.identity.name} · ${r.identity.role}`:'Anonymous'}
                  </div>
                  <div style={{fontFamily:'var(--f-serif)',fontSize:14,color:'var(--charcoal)',lineHeight:1.6,fontStyle:'italic'}}>
                    "...{r.belief}"
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* STRATEGIC FIT */}
          <div className="card">
            <div className="card-hdr"><div className="card-title">I·02 · Strategic Fit Test — Average Scores (1–5)</div></div>
            <div className="card-body">
              <div className="agree-summary">
                {[['strategicFit','Reflects how Implement thinks about its advantage'],['replicability','A competitor could replicate this within 2 years'],['jcTransformation','Changes what it means to be a Junior Consultant']].map(([key,label])=>{
                  const avg=agreeAvg(key);
                  return(
                    <div key={key} className="agree-sum-row">
                      <div className="agree-sum-label">{label}</div>
                      <div className="agree-sum-bar"><div className="agree-sum-fill" style={{width:`${avg?avg/5*100:0}%`}}/></div>
                      <div className="agree-sum-score">{avg??'—'}</div>
                    </div>
                  );
                })}
              </div>
              <div style={{fontSize:11,color:'var(--mid)',fontStyle:'italic'}}>Note: for Statement B (replicability), a low score (1–2) is the desired outcome — it means respondents believe the moat is strong.</div>
            </div>
          </div>

          {/* FEATURE DUEL */}
          <div className="card">
            <div className="card-hdr"><div className="card-title">I·04 · Feature Duel — Total Wins</div></div>
            <div className="card-body">
              <div className="bar-chart">
                {sortedFeatures.map(([id,count])=>{
                  const feat=FEATURES.find(f=>f.num===id)||{name:id};
                  return(
                    <div key={id} className="bar-row">
                      <div className="bar-name">{feat.name}</div>
                      <div className="bar-track"><div className="bar-fill" style={{width:n>0?`${count/n*100}%`:'0%'}}/></div>
                      <div className="bar-count">{count}</div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* LAYER IMPORTANCE */}
          <div className="card">
            <div className="card-hdr"><div className="card-title">I·03 · Layer Importance — "High" Votes</div></div>
            <div className="card-body">
              <div className="bar-chart">
                {LAYERS.map((l,i)=>(
                  <div key={i} className="bar-row">
                    <div className="bar-name" style={{fontSize:11}}><span style={{fontFamily:'var(--f-mono)',fontSize:9,color:'var(--mid)',marginRight:4}}>{l.num}</span>{l.name}</div>
                    <div className="bar-track"><div className="bar-fill" style={{width:n>0?`${layerHighCount[i]/n*100}%`:'0%'}}/></div>
                    <div className="bar-count">{layerHighCount[i]}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* ONE SIGNAL */}
          <div className="card">
            <div className="card-hdr"><div className="card-title">I·05 · The One Signal — Must-Haves & Blockers</div></div>
            <div className="card-body">
              {responses.map((r,i)=>(
                <div key={i} style={{marginBottom:16,paddingBottom:16,borderBottom:'1px solid var(--light)'}}>
                  <div style={{fontFamily:'var(--f-mono)',fontSize:8,color:'var(--mid)',letterSpacing:1,marginBottom:8,textTransform:'uppercase'}}>
                    {r.identity?`${r.identity.name} · ${r.identity.role}`:'Anonymous'}
                  </div>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                    <div>
                      <div style={{fontFamily:'var(--f-mono)',fontSize:8,color:'var(--ok)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Must have</div>
                      <div style={{fontSize:12,color:'var(--charcoal)',lineHeight:1.6,padding:'8px 10px',background:'#F0F7F0',borderRadius:2}}>{r.mustHave}</div>
                    </div>
                    <div>
                      <div style={{fontFamily:'var(--f-mono)',fontSize:8,color:'var(--risk)',letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Blocker</div>
                      <div style={{fontSize:12,color:'var(--charcoal)',lineHeight:1.6,padding:'8px 10px',background:'#FBF0EE',borderRadius:2}}>{r.blocker}</div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ═══════════════════════════════════
   APP
═══════════════════════════════════ */
function App(){
  const [view,setView]=useState('participant');
  return(
    <>
    <style>{CSS}</style>
    <nav className="top-nav">
      <div className="top-nav-logo">Implement · Transformation OS · Field Brief</div>
      <div className="top-nav-right">
        <button className={`nav-btn${view==='participant'?' active':''}`} onClick={()=>setView('participant')}>Participant View</button>
        <button className={`nav-btn${view==='results'?' active':''}`} onClick={()=>setView('results')}>Results Dashboard</button>
      </div>
    </nav>
    {view==='participant'?<ParticipantView/>:<ResultsDashboard/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
